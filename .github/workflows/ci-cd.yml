name: CI/CD

on:                           # check every pull request
  pull_request:               # and every merge to main
  push:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q app tests

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

  deploy:
        needs: check # only after check has passed
        if: github.event_name == 'push' # only after a merge to main, never on a PR
        runs-on: ubuntu-latest
        steps:
          - name: Trigger the Render deploy
            env:
              HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
            run: curl -fsS -X POST "$HOOK"
